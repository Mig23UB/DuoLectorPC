<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DuoLector · Hogar</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/tema/fuentes.css?v=1">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="scene" aria-label="Habitación en 3D"></canvas>
<div id="labels" aria-hidden="true"></div>

<div id="loading" class="loading"><div class="spinner"></div><p data-t="loading"></p></div>

<header class="hud-top">
  <a id="back" class="chip" href="/" aria-label="DuoLector">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
    <span>DuoLector</span>
  </a>
  <button id="codeChip" class="chip" hidden></button>
  <span id="presence" class="chip soft" hidden></span>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Día o noche">
    <button id="btnDay" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-t="day"></span></button>
    <button id="btnNight" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span data-t="night"></span></button>
  </div>
  <select id="lang" class="chip" aria-label="Idioma"><option value="es">ES</option><option value="en">EN</option><option value="ru">RU</option></select>
</header>

<p id="help" class="help" data-t="help"></p>

<footer class="hud-bottom">
  <div class="actions">
    <button id="btnSit" class="pill"><span data-t="sit"></span></button>
    <button id="btnWave" class="pill"><span data-t="wave"></span></button>
    <button id="btnDance" class="pill"><span data-t="dance"></span></button>
  </div>
  <form id="chat" class="chat" autocomplete="off">
    <input id="chatIn" maxlength="140" data-tp="say" aria-label="Mensaje">
    <button class="send" aria-label="Enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2-7z"/></svg></button>
  </form>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Entrada: crear o unirse, y elegir cómo te ves -->
<section id="lobby" class="panel" hidden>
  <h1 data-t="title"></h1>
  <p class="muted" data-t="tagline"></p>
  <div id="accountNote" class="note" hidden data-t="fromAccount"></div>
  <label class="field"><span data-t="yourName"></span><input id="name" maxlength="24" autocomplete="nickname"></label>
  <div class="field"><span data-t="look"></span>
    <div class="row" id="gRow"><button data-g="female" data-t="woman"></button><button data-g="male" data-t="man"></button></div>
    <div class="row" id="skinRow"><span class="lbl" data-t="skin"></span><button data-skin="light" data-t="light"></button><button data-skin="dark" data-t="dark"></button></div>
    <div class="row" id="hairRow"><span class="lbl" data-t="hair"></span></div>
    <div class="row swatches" id="hairCRow"></div>
    <div class="row swatches" id="shirtRow"><span class="lbl" data-t="shirt"></span></div>
    <div class="row swatches" id="pantsRow"><span class="lbl" data-t="pants"></span></div>
  </div>
  <div id="codeArea">
    <button id="btnCreate" class="primary" data-t="create"></button>
    <div class="or"><span></span></div>
    <div class="join"><input id="codeIn" data-tp="codePh" autocapitalize="characters"><button id="btnJoin" class="ghost" data-t="enter"></button></div>
  </div>
  <button id="btnEnterAcc" class="primary" hidden data-t="enter"></button>
</section>

<section id="codeBox" class="panel small" hidden>
  <h2 data-t="codeIs"></h2>
  <div class="code" id="codeShow"></div>
  <p class="muted" data-t="share"></p>
  <div class="row"><button id="btnCopy" class="primary" data-t="copy"></button><button id="btnCodeClose" class="ghost" data-t="close"></button></div>
</section>

<section id="photoBox" class="panel small" hidden>
  <h2 data-t="photo"></h2>
  <p class="muted" data-t="photoNote"></p>
  <div class="row">
    <label class="primary file"><span data-t="putPhoto"></span><input id="photoIn" type="file" accept="image/*" hidden></label>
    <button id="btnPhotoDel" class="ghost" data-t="removePhoto"></button>
    <button id="btnPhotoClose" class="ghost" data-t="close"></button>
  </div>
</section>

<p class="credits">Personas y animaciones: Quaternius (CC0). Lumi y la casa: DuoLector.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
